  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" />

